            or enrollment_status
        credit_hours:
          type:
          - string
          - 'null'
          format: decimal
          description: Number of credit hours for an education activity, converted
            to hours on intake. Permitted only on education activities, and ignored
            when hours is also supplied
        enrollment_status:
          type:
          - string
          - 'null'
          enum:
          - full_time
          - half_time
          - less_than_half_time
          -
          description: Enrollment status for an education activity. Permitted only
            on education activities. Enrollment of full_time or half_time meets the
            community engagement requirement on its own, whatever hours are reported
        gross_income:
          type:
          - string
          - 'null'
          format: decimal
          description: Gross income for the period. May be reported alongside hours,
            in which case one record per month is created carrying both values
        source:
          type:
          - string
          - 'null'
          enum:
          - api
          -
          description: Data source type; required when gross_income is supplied
        reported_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the external source reported this data
        period_start:
          type: string
          format: date
          description: Start date of the activity period
        period_end:
          type: string
          format: date
          description: End date of the activity period
        employer:
          type:
          - string
          - 'null'
          description: Employer or organization associated with the activity
        name:
          type:
          - string
          - 'null'
          description: Name of the school or organization associated with the activity,
            where employer does not apply. Recorded as the employer when employer
            is not supplied
        verification_status:
          type: string
          enum:
          - verified
