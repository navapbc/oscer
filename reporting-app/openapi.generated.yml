      type: object
      description: 'Community engagement activity. There is no type discriminator:
        which values are present decides what is recorded. An activity may report
        hours, gross income, or both'
      properties:
        category:
          type: string
          enum:
          - employment
          - community_service
          - education
          - unearned
          description: The category of activity
        hours:
          type:
          - string
          - 'null'
          format: decimal
          description: Number of hours for the activity; required unless the activity
