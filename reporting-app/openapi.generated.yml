---
components:
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: 'HMAC-SHA256 signature. Format: HMAC sig={base64_encoded_signature}.
        The signature is computed from the request body using the shared secret key.'
  schemas:
    CertificationCreateRequestBody:
      type: object
      properties:
        member_id:
          type: string
          description: An identifier for the person receiving benefits
        case_number:
          type:
          - string
          - 'null'
          description: An identifier for the case associated with the certification
        application_date:
          type:
          - string
          - 'null'
          format: date
          description: The date of the application
        certification_requirements:
          oneOf:
          - "$ref": "#/components/schemas/CertificationRequirements"
          - "$ref": "#/components/schemas/CertificationRequirementParameters"
          - "$ref": "#/components/schemas/CertificationRequirementTypeParameters"
        member_data:
          oneOf:
          - "$ref": "#/components/schemas/CertificationMemberData"
          - type: 'null'
        household_data:
          oneOf:
          - "$ref": "#/components/schemas/CertificationHouseholdData"
          - type: 'null'
      required:
      - member_id
      - certification_requirements
      examples:
        fully_specified_certification_requirements:
          value:
            member_id: '123'
            case_number: C-111
            certification_requirements:
              certification_date: '2025-09-26'
              certification_period_start: '2025-04-01'
              certification_period_end: '2025-09-30'
              number_of_months_to_certify: 1
              due_date: '2025-10-26'
              months_that_can_be_certified:
              - '2025-06-01'
              - '2025-07-01'
              - '2025-08-01'
            member_data:
              account_email: john@doe.com
              contact:
                email: john@doe.com
                phone: "+123456789"
              name:
                first: Johnathan
                middle: Alfred
                last: Doe
                suffix: Jr.
              activities:
              - category: community_service
                hours: '20'
                period_start: '2025-08-01'
                period_end: '2025-08-31'
                employer: Community Center
                verification_status: verified
              - category: education
                credit_hours: '9'
                enrollment_status: full_time
                period_start: '2025-08-01'
                period_end: '2025-08-31'
                name: State University
                verification_status: verified
              date_of_birth: '1980-01-01'
              race_ethnicity: Hispanic
              pregnancy_status: false
        without_explicit_months_that_can_be_certified_and_due_date:
          value:
            member_id: '123'
            case_number: C-111
            certification_requirements:
              certification_date: '2025-09-26'
              certification_period_start: '2025-04-01'
              certification_period_end: '2025-09-30'
              lookback_period: 3
              number_of_months_to_certify: 1
              due_period_days: 30
            member_data:
              account_email: john@doe.com
              contact:
                email: john@doe.com
                phone: "+123456789"
              name:
                first: Johnathan
                middle: Alfred
                last: Doe
                suffix: Jr.
              date_of_birth: '1980-01-01'
              race_ethnicity: Hispanic
              pregnancy_status: false
        certification_type:
          value:
            member_id: '123'
            case_number: C-111
            certification_requirements:
              certification_date: '2025-09-26'
              certification_type: new_application
            member_data:
              account_email: john@doe.com
              contact:
                email: john@doe.com
                phone: "+123456789"
              name:
                first: Johnathan
                middle: Alfred
                last: Doe
                suffix: Jr.
              date_of_birth: '1980-01-01'
              race_ethnicity: Hispanic
              pregnancy_status: false
    CertificationRequirements:
      type: object
      description: Description of certification needs
      properties:
        certification_date:
          type: string
          format: date
          description: The date of the certification
        certification_period_start:
          type:
          - string
          - 'null'
          format: date
          description: First day of the member's active certification period. Supplied
            for recertification and change in circumstance; absent for a new application,
            which has no prior coverage period.
        certification_period_end:
          type:
          - string
          - 'null'
          format: date
          description: Last day of the member's active certification period. Supplied
            for recertification and change in circumstance; absent for a new application.
        certification_type:
          type:
          - string
          - 'null'
          enum:
          - new_application
          - recertification
          - change_in_circumstance
          -
          description: The type of certification
        months_that_can_be_certified:
          type:
          - array
          - 'null'
          items:
            type: string
            format: date
          description: The list of months the Member can choose from
        number_of_months_to_certify:
          type:
          - integer
          - 'null'
          description: The number of months the Member needs to certify
        due_date:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the Member must have submitted their evidence
        seasonal_worker:
          type:
          - boolean
          - 'null'
          description: Whether the member is a seasonal worker
        self_employed:
          type:
          - boolean
          - 'null'
          description: Whether the member is self employed
      required:
      - certification_date
    CertificationRequirementParameters:
      type: object
      properties:
        certification_date:
          type: string
          format: date
          description: The date of the certification
        certification_period_start:
          type:
          - string
          - 'null'
          format: date
          description: First day of the member's active certification period. Supplied
            for recertification and change in circumstance; absent for a new application,
            which has no prior coverage period.
        certification_period_end:
          type:
          - string
          - 'null'
          format: date
          description: Last day of the member's active certification period. Supplied
            for recertification and change in circumstance; absent for a new application.
        lookback_period:
          type: integer
          description: The number of months before `certification_date` the Member
            can choose from
        number_of_months_to_certify:
          type: integer
          description: The number of months the Member needs to certify
        due_period_days:
          type: integer
        due_date:
          type:
          - string
          - 'null'
          format: date
          description: Date by which the Member must have submitted their evidence
      required:
      - certification_date
      - lookback_period
      - number_of_months_to_certify
    CertificationRequirementTypeParameters:
      type: object
      properties:
        certification_date:
          type: string
          format: date
          description: The date of the certification
        certification_period_start:
          type:
          - string
          - 'null'
          format: date
          description: First day of the member's active certification period. Supplied
            for recertification and change in circumstance; absent for a new application,
            which has no prior coverage period.
        certification_period_end:
          type:
          - string
          - 'null'
          format: date
          description: Last day of the member's active certification period. Supplied
            for recertification and change in circumstance; absent for a new application.
        certification_type:
          type: string
          enum:
          - new_application
          - recertification
          - change_in_circumstance
          description: The type of certification
      required:
      - certification_date
      - certification_type
